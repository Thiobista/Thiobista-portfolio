<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1712"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d89a52"/>
      <stop offset="1" stop-color="#a46528"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- window -->
  <rect x="40" y="36" width="720" height="428" rx="14" fill="#181818" stroke="#33353f"/>
  <circle cx="64" cy="58" r="5" fill="#ef4444"/><circle cx="82" cy="58" r="5" fill="#eab308"/><circle cx="100" cy="58" r="5" fill="#22c55e"/>
  <line x1="40" y1="78" x2="760" y2="78" stroke="#33353f"/>
  <!-- sidebar -->
  <rect x="40" y="78" width="150" height="386" fill="#151515"/>
  <text x="60" y="110" fill="#d89a52" font-size="16" font-weight="700">GymERP</text>
  <g fill="#adb7be" font-size="12">
    <rect x="52" y="128" width="126" height="26" rx="6" fill="#c47f32" fill-opacity="0.18"/>
    <text x="64" y="145" fill="#ffffff">Dashboard</text>
    <text x="64" y="177">Members</text>
    <text x="64" y="205">Memberships</text>
    <text x="64" y="233">Attendance</text>
    <text x="64" y="261">Payments</text>
    <text x="64" y="289">Reports</text>
    <text x="64" y="317">Settings</text>
  </g>
  <!-- stat cards -->
  <g font-size="11" fill="#9ca2a9">
    <rect x="210" y="98" width="128" height="74" rx="8" fill="#1f1f1f" stroke="#33353f"/>
    <text x="224" y="120">Active members</text>
    <text x="224" y="152" fill="#fff" font-size="22" font-weight="700">1,284</text>
    <rect x="352" y="98" width="128" height="74" rx="8" fill="#1f1f1f" stroke="#33353f"/>
    <text x="366" y="120">Check-ins today</text>
    <text x="366" y="152" fill="#fff" font-size="22" font-weight="700">342</text>
    <rect x="494" y="98" width="128" height="74" rx="8" fill="#1f1f1f" stroke="#33353f"/>
    <text x="508" y="120">Revenue (MTD)</text>
    <text x="508" y="152" fill="#fff" font-size="22" font-weight="700">ETB 486k</text>
    <rect x="636" y="98" width="104" height="74" rx="8" fill="#1f1f1f" stroke="#33353f"/>
    <text x="650" y="120">Expiring</text>
    <text x="650" y="152" fill="#d89a52" font-size="22" font-weight="700">27</text>
  </g>
  <!-- chart -->
  <rect x="210" y="188" width="330" height="256" rx="8" fill="#1f1f1f" stroke="#33353f"/>
  <text x="226" y="212" fill="#fff" font-size="12" font-weight="600">Monthly revenue</text>
  <g stroke="#2a2a2a"><line x1="226" y1="260" x2="524" y2="260"/><line x1="226" y1="320" x2="524" y2="320"/><line x1="226" y1="380" x2="524" y2="380"/></g>
  <g fill="url(#bar)">
    <rect x="236" y="340" width="26" height="80" rx="3"/>
    <rect x="276" y="318" width="26" height="102" rx="3"/>
    <rect x="316" y="330" width="26" height="90" rx="3"/>
    <rect x="356" y="296" width="26" height="124" rx="3"/>
    <rect x="396" y="280" width="26" height="140" rx="3"/>
    <rect x="436" y="258" width="26" height="162" rx="3"/>
    <rect x="476" y="236" width="26" height="184" rx="3"/>
  </g>
  <!-- table -->
  <rect x="556" y="188" width="184" height="256" rx="8" fill="#1f1f1f" stroke="#33353f"/>
  <text x="572" y="212" fill="#fff" font-size="12" font-weight="600">Recent check-ins</text>
  <g font-size="11" fill="#adb7be">
    <g><circle cx="580" cy="242" r="9" fill="#33353f"/><rect x="596" y="236" width="80" height="6" rx="3" fill="#3a3a3a"/><rect x="596" y="246" width="50" height="5" rx="2.5" fill="#2c2c2c"/><text x="700" y="246" fill="#22c55e">QR</text></g>
    <g><circle cx="580" cy="282" r="9" fill="#33353f"/><rect x="596" y="276" width="70" height="6" rx="3" fill="#3a3a3a"/><rect x="596" y="286" width="44" height="5" rx="2.5" fill="#2c2c2c"/><text x="692" y="286" fill="#d89a52">Kiosk</text></g>
    <g><circle cx="580" cy="322" r="9" fill="#33353f"/><rect x="596" y="316" width="86" height="6" rx="3" fill="#3a3a3a"/><rect x="596" y="326" width="56" height="5" rx="2.5" fill="#2c2c2c"/><text x="700" y="326" fill="#22c55e">QR</text></g>
    <g><circle cx="580" cy="362" r="9" fill="#33353f"/><rect x="596" y="356" width="64" height="6" rx="3" fill="#3a3a3a"/><rect x="596" y="366" width="40" height="5" rx="2.5" fill="#2c2c2c"/><text x="686" y="366">Manual</text></g>
    <g><circle cx="580" cy="402" r="9" fill="#33353f"/><rect x="596" y="396" width="76" height="6" rx="3" fill="#3a3a3a"/><rect x="596" y="406" width="48" height="5" rx="2.5" fill="#2c2c2c"/><text x="700" y="406" fill="#22c55e">QR</text></g>
  </g>
</svg>
